name: market-losers-dashboard

on:
  schedule:
    # 9:00am hora México (CDT = UTC-6) → 15:00 UTC, lunes a viernes
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar dashboard
        run: python market_losers_dashboard.py

      - name: Commitear dashboard al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/index.html public/historico
          git diff --cached --quiet || git commit -m "chore: update market losers dashboard [skip ci]"
          git push

      - name: Deploy a Firebase Hosting
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --silent
          # Ver .github/workflows/japan-fare-monitor.yml para el porque de estas
          # dos correcciones (flag --site invalido + BOM en el secreto).
          CLEAN_TOKEN=$(printf '%s' "$FIREBASE_TOKEN" | sed '1s/^\xef\xbb\xbf//' | tr -d '\r\n')
          firebase deploy --only hosting --token "$CLEAN_TOKEN" --non-interactive
