name: market-losers-dashboard

# Desactivado: el dashboard de / lo publica ahora la rutina de Claude
# "market-losers-dashboard" (versión detallada). Este workflow queda solo para
# ejecución manual y ya no publica en Firebase.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar dashboard
        run: python market_losers_dashboard.py

      - name: Commitear dashboard al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/index.html public/historico
          git diff --cached --quiet || git commit -m "chore: update market losers dashboard [skip ci]"
          git push

      # Sin paso de deploy a Firebase a propósito: / lo publica la rutina de
      # Claude. Si se corre a mano, este workflow solo actualiza el repo.
