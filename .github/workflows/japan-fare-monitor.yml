name: japan-fare-monitor

on:
  schedule:
    # 9:00am hora México (UTC-6, sin horario de verano desde 2022) → 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Japan Fare Monitor
        env:
          AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python JapanFareBot/japan_fare_monitor.py

      - name: Commitear historico de precios y reporte al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f JapanFareBot/price_history.json public/japan-fares
          git diff --cached --quiet || git commit -m "chore: update japan fare report [skip ci]"
          git push

      - name: Deploy a Firebase Hosting
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --silent
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --site market-dashboard-gga --non-interactive
