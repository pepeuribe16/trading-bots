name: japan-fare-monitor

on:
  schedule:
    # 9:00am hora México (UTC-6, sin horario de verano desde 2022) → 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar Japan Fare Monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python JapanFareBot/japan_fare_monitor.py

      - name: Commitear reporte al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/japan-fares
          git diff --cached --quiet || git commit -m "chore: update japan fare report [skip ci]"
          git push

      # firebase deploy reemplaza el sitio completo con public/. La rutina de
      # Claude market-losers-dashboard publica / y /historico/ directo en
      # Firebase (no en el repo), así que primero traemos esas páginas del sitio
      # en vivo para no pisarlas con la copia vieja del repo.
      - name: Preservar páginas publicadas por rutinas de Claude
        id: sync
        continue-on-error: true
        run: python scripts/sync_live_site.py

      - name: Deploy a Firebase Hosting
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --silent
          # FIREBASE_TOKEN a veces trae un BOM (U+FEFF) u otros bytes invisibles
          # cuando se pega desde ciertos editores; eso rompe el header HTTP que
          # arma firebase-tools ("Cannot convert argument to a ByteString...").
          CLEAN_TOKEN=$(printf '%s' "$FIREBASE_TOKEN" | sed '1s/^\xef\xbb\xbf//' | tr -d '\r\n')
          firebase deploy --only hosting --token "$CLEAN_TOKEN" --non-interactive
