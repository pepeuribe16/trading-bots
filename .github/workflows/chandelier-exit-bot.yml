name: chandelier-exit-bot

on:
  # El disparo principal es la rutina de Claude "Chandelier Bot · disparo diario" (19:45 UTC,
  # 3:45pm ET), porque GitHub retrasa los horarios programados varias horas. Estos crons son
  # respaldo: si corren con el mercado cerrado, el bot solo actualiza la página.
  schedule:
    - cron: "45 17 * * 1-5"
    - cron: "45 19 * * 1-5"
  workflow_dispatch:
    inputs:
      solo_pagina:
        description: "Solo regenerar /portfolio/ (no escanea ni opera)"
        type: boolean
        default: false

permissions:
  contents: write

# Mismo grupo que los demás workflows que publican en Firebase.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Chandelier Exit Bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python ChandelierBot/chandelier_bot.py ${{ inputs.solo_pagina && '--page-only' || '' }}

      - name: Commitear stops y página de portafolio al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ChandelierBot/chandelier_stops.json public/portfolio/index.html
          git diff --cached --quiet || git commit -m "chore: update chandelier stops + portfolio page [skip ci]"
          git push

      - name: Preservar páginas publicadas por rutinas de Claude
        id: sync
        continue-on-error: true
        run: python scripts/sync_live_site.py

      - name: Publicar en Firebase Hosting
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools --silent
          # Ver japan-fare-monitor.yml: limpia BOM y saltos de línea del secreto.
          CLEAN_TOKEN=$(printf '%s' "$FIREBASE_TOKEN" | sed '1s/^\xef\xbb\xbf//' | tr -d '\r\n')
          firebase deploy --only hosting --token "$CLEAN_TOKEN" --non-interactive
